name: Generate products-search catalog

on:
  push:
    branches: [main, master]
    paths:
      - 'data/products.json'
      - 'tools/generate-search-catalog.py'
      - '.github/workflows/generate-search-catalog.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate products-search.json
        run: |
          if [ ! -f tools/generate-search-catalog.py ]; then
            echo "Missing tools/generate-search-catalog.py"
            exit 1
          fi
          python3 tools/generate-search-catalog.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/products-search.json
          if git diff --staged --quiet; then
            echo "No catalog changes"
            exit 0
          fi
          git commit -m "chore: regenerate products-search.json [skip ci]"
          git push
